/* ===================== Firebase: login e acesso ===================== */
const FB={db:null,email:'',user:null};
const ERR_AUTH={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/email-already-in-use':'Este e-mail já tem cadastro. Use "Entrar" ou "Esqueci a senha".','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.','auth/missing-password':'Digite a senha.','auth/operation-not-allowed':'Login por e-mail e senha não está ativado no Firebase.'};
const msgAuth=e=>ERR_AUTH[e?.code]||('Não foi possível entrar ('+esc(e?.code||e?.message||'erro')+').');
function telaLogin(msg,modo){
  let o=document.getElementById('fbLogin');if(!o){o=document.createElement('div');o.id='fbLogin';document.body.appendChild(o);}
  const topo=`<div class="mark" style="margin:0 auto"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21V12h6v9"/></svg></div>
  <h1 style="font-size:22px;margin:6px 0 0">Almoxarifado Osório</h1><p class="muted" style="margin:0">Grupo Setup</p>
  ${msg?`<p id="fbMsg" style="color:var(--warn);font-size:14px;margin:0">${msg}</p>`:'<p id="fbMsg" style="font-size:14px;margin:0"></p>'}`;
  let corpo;
  if(modo==='sair')corpo=`<button class="btn" id="fbSair" style="justify-content:center">Entrar com outra conta</button>`;
  else if(modo==='verificar')corpo=`<button class="btn pri" id="fbJaConf" style="justify-content:center">Já confirmei</button><button class="btn" id="fbReenv" style="justify-content:center">Reenviar e-mail de confirmação</button><button class="btn ghost" id="fbSair" style="justify-content:center">Sair</button>`;
  else corpo=`<button class="btn pri" id="fbEntrar" style="justify-content:center">Entrar com Google</button>
    <div class="fb-ou"><span>ou com e-mail e senha</span></div>
    <input id="fbEmail" type="email" autocomplete="username" placeholder="E-mail (ex.: nome@gruposetup.com)">
    <input id="fbSenha" type="password" autocomplete="current-password" placeholder="Senha">
    <button class="btn" id="fbLoginEmail" style="justify-content:center">Entrar</button>
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><a href="#" id="fbCriar" style="color:var(--accent-hi)">Primeiro acesso: criar senha</a><a href="#" id="fbEsqueci" style="color:var(--muted)">Esqueci a senha</a></div>`;
  o.innerHTML=`<div class="fb-card">${topo}${corpo}</div>`;o.style.display='grid';
  const A=firebase.auth(),$=id=>document.getElementById(id);
  const aviso=(t,ok)=>{const m=$('fbMsg');if(m){m.innerHTML=t;m.style.color=ok?'var(--ok)':'var(--warn)';}};
  const dados=()=>[($('fbEmail')?.value||'').trim().toLowerCase(),$('fbSenha')?.value||''];
  $('fbEntrar')?.addEventListener('click',async()=>{try{await A.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')A.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')aviso(msgAuth(e));}});
  $('fbLoginEmail')?.addEventListener('click',async()=>{const [em,se]=dados();if(!em){aviso('Digite o e-mail.');return;}try{await A.signInWithEmailAndPassword(em,se);}catch(e){aviso(msgAuth(e));}});
  $('fbSenha')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('fbLoginEmail').click();});
  $('fbCriar')?.addEventListener('click',async e=>{e.preventDefault();const [em,se]=dados();if(!em||!se){aviso('Digite o e-mail e escolha uma senha (mínimo 6 caracteres) e clique de novo em "Primeiro acesso".');return;}
    try{const c=await A.createUserWithEmailAndPassword(em,se);await c.user.sendEmailVerification();}catch(e){aviso(msgAuth(e));}});
  $('fbEsqueci')?.addEventListener('click',async e=>{e.preventDefault();const [em]=dados();if(!em){aviso('Digite o e-mail e clique de novo em "Esqueci a senha".');return;}
    try{await A.sendPasswordResetEmail(em);aviso('Enviamos um link para redefinir a senha em '+esc(em)+'. Veja também a caixa de spam.',true);}catch(e){aviso(msgAuth(e));}});
  $('fbJaConf')?.addEventListener('click',async()=>{const u=A.currentUser;if(!u)return;await u.reload();if(u.emailVerified){await u.getIdToken(true);location.reload();}else aviso('O e-mail ainda não foi confirmado. Abra o link que enviamos (veja também o spam).');});
  $('fbReenv')?.addEventListener('click',async()=>{try{await A.currentUser.sendEmailVerification();aviso('E-mail de confirmação reenviado.',true);}catch(e){aviso(msgAuth(e));}});
  $('fbSair')?.addEventListener('click',()=>A.signOut());
}
document.addEventListener('click',e=>{if(e.target.closest('[data-sair]')){e.preventDefault();firebase.auth().signOut().then(()=>location.reload());}});
(async()=>{
  render();
  if(!window.firebase||!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){telaLogin('Configuração do Firebase não encontrada neste arquivo.',false);return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  FB.db=firebase.firestore();try{FB.db.settings({ignoreUndefinedProperties:true,merge:true});}catch(e){}
  let iniciado=false;
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){FB.user=null;telaLogin('');return;}
    FB.user=u;FB.email=(u.email||'').toLowerCase();
    if(!u.emailVerified){telaLogin(`Confirme o seu e-mail para entrar: enviamos um link para <b>${esc(FB.email)}</b> (veja também a caixa de spam). Depois clique em "Já confirmei".`,'verificar');return;}
    try{await FB.db.doc('config/geral').get();}
    catch(e){if(e.code==='permission-denied'){telaLogin(`O e-mail <b>${esc(FB.email)}</b> ainda não tem acesso. Peça para o responsável liberar em Ajustes → Acesso.`,'sair');return;}}
    document.getElementById('fbLogin')?.remove();
    if(iniciado)return;iniciado=true;
    await Store.init();
    try{await Store.loadAll();}catch(e){console.error(e);toast('Não consegui carregar os dados ('+(e.code||'erro')+'). Recarregue a página.','bad');}
    try{const a=await FB.db.doc('acesso/usuarios').get();ST.acesso=a.exists?(a.data().emails||[]):[];}catch(e){ST.acesso=[];}
    ST.loading=false;render();
  });
})();
function secAcesso(){
  const dono=FB.email===DONO_EMAIL.toLowerCase();const L=ST.acesso||[];
  return `<section class="panel"><h2>Acesso</h2>
  <p class="muted">Quem pode entrar no sistema com a conta Google. ${dono?'Só você (responsável) pode liberar ou remover pessoas.':'Só o responsável ('+esc(DONO_EMAIL)+') pode alterar esta lista.'}</p>
  <div class="tablebox"><table><thead><tr><th>E-mail</th><th></th></tr></thead><tbody>
  <tr><td>${esc(DONO_EMAIL)} <span class="pill acc">Responsável</span></td><td></td></tr>
  ${L.map(m=>`<tr><td>${esc(m)}</td><td style="text-align:right">${dono?`<button class="btn sm" data-ac-del="${esc(m)}">Remover</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>
  ${dono?`<div class="actions" style="margin-top:10px"><input id="acEmail" type="email" placeholder="email@gmail.com" style="min-width:260px"><button class="btn pri" data-ac-add="1">Liberar acesso</button></div>`:''}</section>`;
}
async function salvarAcesso(L){ST.acesso=L;try{await FB.db.doc('acesso/usuarios').set({emails:L,atualizado:new Date().toISOString()});toast('Lista de acesso atualizada.');}catch(e){toast('Não foi possível salvar o acesso ('+(e.code||'erro')+').','bad');}render();}
document.addEventListener('click',e=>{
  const ad=e.target.closest('[data-ac-add]');if(ad){const v=(document.getElementById('acEmail').value||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Digite um e-mail válido.','bad');return;}if((ST.acesso||[]).includes(v)||v===DONO_EMAIL.toLowerCase()){toast('Esse e-mail já tem acesso.');return;}salvarAcesso([...(ST.acesso||[]),v]);}
  const dl=e.target.closest('[data-ac-del]');if(dl){salvarAcesso((ST.acesso||[]).filter(x=>x!==dl.dataset.acDel));}
});
