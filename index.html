<style>
/* Layout: barra lateral escura com navegação por ícones; área de trabalho com painéis e tabelas densas, detalhes em verde. */
:root{
  --bg:#0A100F; --side:#070C0B; --surface:#101917; --raised:#16211E; --sunken:#0C1412; --line:#1E2B27; --line2:#2A3A35;
  --fg:#E3EBE8; --muted:#869893; --faint:#5D6E69;
  --accent:#2CCF7C; --accent-hi:#5BE29C; --accent-fg:#03130A; --accent-soft:rgba(44,207,124,.12); --accent-line:rgba(44,207,124,.35);
  --ok:#2CCF7C; --ok-soft:rgba(44,207,124,.12); --warn:#F0B44C; --warn-soft:rgba(240,180,76,.13); --bad:#F1665B; --bad-soft:rgba(241,102,91,.13);
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}

/* barra lateral */
aside.side{position:sticky;top:0;height:100dvh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px;padding:22px 14px 18px}
.brand{display:flex;align-items:center;gap:11px;padding-inline:6px}
.mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#138A4F);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
.mark svg{width:20px;height:20px;stroke:var(--accent-fg)}
.brand-t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1;letter-spacing:.01em}
.brand-t small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
nav.tabs{display:flex;flex-direction:column;gap:3px}
.navlbl{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px}
nav.tabs button{display:flex;align-items:center;gap:11px;font:500 14px var(--body);background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:7px;cursor:pointer;text-align:left;white-space:nowrap;position:relative}
nav.tabs button svg{width:18px;height:18px;stroke:currentColor;flex:none}
nav.tabs button:hover{background:var(--raised);color:var(--fg)}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-hi)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.store{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.today{font-size:12px;color:var(--faint)}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{position:sticky;top:0;z-index:30;height:auto;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;border-right:0;border-bottom:1px solid var(--line)}
  nav.tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:2px;margin-inline:-6px}
  .navlbl,.side .foot{display:none}
  nav.tabs button{padding:9px 10px 11px;border-radius:7px 7px 0 0}
  nav.tabs button[aria-current="true"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px;border-radius:3px 3px 0 0}
}

main{padding-block:28px 64px;padding-inline:32px;display:flex;flex-direction:column;gap:22px;max-width:none;width:100%;min-width:0}
@media (max-width:880px){main{padding-inline:16px;padding-block:20px 56px}}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.005em}
h2{font-family:var(--display);font-size:18.5px;font-weight:600;letter-spacing:.005em}
h3{font-size:14.5px;font-weight:600}
.h1-sub{color:var(--accent-hi);font-weight:600}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--fg)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
p{margin:0;max-width:72ch}
b{font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head > div:not(.actions):not(.chips):not(.steps){display:flex;flex-direction:column;gap:4px;min-width:0}
td.mono{white-space:nowrap}
b.acc{color:var(--accent-hi)}
.panel > .head:first-child{padding-bottom:12px;border-bottom:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.btn{font:500 13.5px var(--body);border-radius:7px;border:1px solid var(--line2);background:var(--raised);color:var(--fg);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-line);background:#1A2724}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.danger{color:var(--bad);border-color:rgba(241,102,91,.45);background:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.ghost:hover{color:var(--accent-hi);background:none}
.btn.sm{font-size:12.5px;padding:4px 8px}
.btn:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--sunken);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{font-family:var(--mono);font-size:12.5px;width:100%;min-height:120px}
input.qty{width:96px;text-align:right;font-family:var(--mono);font-size:12.5px;padding:5px 8px}
input[type="date"]{color-scheme:dark}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sunken)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--sunken);padding:10px 12px;white-space:nowrap;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line2)}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle;background:var(--surface)}
tbody tr:first-child td{border-top:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--raised)}
td.desc{min-width:220px}
th.num{text-align:right;font-family:var(--body);font-size:10.5px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--raised);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-hi)}
tr.s-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.s-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}

/* fluxo de etapas */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.flow button{all:unset;cursor:pointer;padding:16px 16px 14px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;transition:border-color .15s}
.flow button::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--line2)}
.flow button.has::after{background:var(--accent)}
.flow button:hover{border-color:var(--accent-line)}
.flow button:focus-visible{outline:2px solid var(--accent)}
.flow .i{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--faint)}
.flow .n{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--faint)}
.flow button.has .n{color:var(--fg)}
.flow .t{font-size:13.5px;font-weight:600}
.flow .s{font-size:12px;color:var(--muted)}
@media (max-width:980px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}

.steps{display:flex;flex-wrap:wrap;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.steps button{font:500 12.5px var(--body);background:none;color:var(--faint);border:0;padding:6px 11px;cursor:pointer;border-radius:6px}
.steps button.done{color:var(--muted)}
.steps button.done::before{content:"✓ ";color:var(--accent)}
.steps button:hover{color:var(--fg)}
.steps button.cur{background:var(--accent);color:var(--accent-fg);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.tile b{font-family:var(--display);font-size:27px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile.bad b{color:var(--bad)} .tile.ok b{color:var(--ok)} .tile.warn b{color:var(--warn)}

.empty{border:1px dashed var(--line2);border-radius:10px;padding:30px 24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--surface)}
tr.done td{opacity:.5}
.app{transition:grid-template-columns .18s ease}
.side-toggle{display:flex;align-items:center;gap:10px;margin-top:auto;font:500 13px var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:8px 10px;cursor:pointer}
.side-toggle:hover{color:var(--fg);border-color:var(--accent-line)}
.side-toggle svg{width:16px;height:16px;stroke:currentColor;flex:none;transition:transform .18s}
.side-toggle + .foot{margin-top:0}
@media (min-width:881px){
  .app.mini{grid-template-columns:68px minmax(0,1fr)}
  .app.mini aside.side{padding-inline:10px}
  .app.mini .brand{justify-content:center;padding-inline:0}
  .app.mini .brand-t,.app.mini .navlbl,.app.mini .foot,.app.mini .side-toggle span{display:none}
  .app.mini nav.tabs button{font-size:0;justify-content:center;gap:0;padding:10px 0}
  .app.mini nav.tabs button svg{width:20px;height:20px}
  .app.mini nav.tabs button[aria-current="true"]::before{left:-10px}
  .app.mini .side-toggle{justify-content:center;padding:8px 0}
  .app.mini .side-toggle svg{transform:rotate(180deg)}
}
@media (max-width:880px){.side-toggle{display:none}}
.tablebox{scrollbar-width:auto;scrollbar-color:var(--muted) var(--sunken)}
.tablebox::-webkit-scrollbar{height:12px}
.tablebox::-webkit-scrollbar-thumb{background:var(--faint);border:3px solid var(--sunken);border-radius:10px}
.tablebox::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.tablebox.podearrastar{cursor:grab}
.tablebox.dragging{cursor:grabbing;user-select:none}
.st-sel.st-nao{color:var(--bad);border-color:rgba(241,102,91,.45);background-color:var(--bad-soft)}
.tag.extra{color:var(--warn);border-color:rgba(240,180,76,.45)}
.addx{border-top:1px dashed var(--line2);padding-top:14px}
.cols.ader{height:160px}
.col-x{font-size:10.5px;color:var(--warn);font-weight:600;min-height:14px}
tr.sel td{background:var(--accent-soft)}
.clk{cursor:pointer}
.kpi.clk{transition:border-color .15s,transform .15s}.kpi.clk:hover{border-color:var(--accent-line)}
.kpi.clk::after{content:"Ver detalhe →";font-size:11.5px;color:var(--accent);margin-top:auto}
.hb-row.clk:hover .hb-l{color:var(--accent-hi);text-decoration:underline;text-underline-offset:3px}
.lg.clk{padding:4px 6px;border-radius:6px;margin-inline:-6px}.lg.clk:hover{background:var(--raised)}
.col.clk:hover .col-l{color:var(--accent-hi)}
:focus-visible.clk{outline:2px solid var(--accent);outline-offset:2px}
.dr-ovl{position:fixed;inset:0;background:rgba(2,6,5,.6);backdrop-filter:blur(2px);z-index:55}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--surface);border-left:1px solid var(--line2);z-index:56;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.45);padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:no-preference){.dr{animation:drIn .2s ease-out}@keyframes drIn{from{transform:translateX(30px);opacity:.4}}}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dr-h > div{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.dr-b{padding:18px 20px calc(30px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dr-b h3{margin-top:6px}
.dk{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.dk > div{background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dk b{font-size:21px;font-weight:600}.dk b.bad{color:var(--bad)}.dk .muted{font-size:12px}
.lnk{all:unset;cursor:pointer;color:var(--fg);line-height:1.35}.lnk:hover{color:var(--accent-hi)}.lnk:focus-visible{outline:2px solid var(--accent)}
.lnk .mono{color:var(--accent-hi)}
body.drill-on{overflow:hidden}
.kpis.cmp{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.kpis.cmp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis.cmp{grid-template-columns:1fr}}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{font:600 14px var(--body);background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.subtabs button[aria-selected="true"]{color:var(--accent-hi);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;align-self:flex-start}
.seg button{font:600 13.5px var(--body);background:none;border:0;color:var(--muted);padding:7px 16px;border-radius:7px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg2 button{font:600 12px var(--body);background:var(--raised);border:0;color:var(--muted);padding:5px 12px;cursor:pointer}
.seg2 button+button{border-left:1px solid var(--line2)}
.seg2 button[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}
.seg2 button.no[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad)}
tfoot td{background:var(--sunken);border-top:1px solid var(--line2)}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
tr.flash td{animation:flash 1.6s ease-out}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.chip-sep{width:1px;align-self:stretch;background:var(--line2);margin-inline:4px}
.aging{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:180px;align-items:end}

.st-sel.st-programada{color:var(--muted)}

:root{--dep1:#3987e5;--dep2:#d95926;--dep3:#199e70;--abcA:#5BE29C;--abcB:#23A866;--abcC:#16683F}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi b{font-family:var(--body);font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.kpi b.bad{color:var(--bad)}
.kpi.hero{background:linear-gradient(135deg,rgba(44,207,124,.16),rgba(44,207,124,.02) 60%),var(--surface);border-color:var(--accent-line)}

<script>
/* ===================== utilidades ===================== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
const fmt=n=>(n==null||n===''||isNaN(n))?'—':nf.format(n);
const fmtS=n=>(n==null||isNaN(n))?'—':(n>0?'+':'')+nf.format(n);
function parseNum(v){
  if(typeof v==='number')return v;
  let s=String(v??'').trim().replace(/\s/g,''); if(!s)return NaN;
  let neg=false; if(/-$/.test(s)){neg=true;s=s.slice(0,-1)}
  if(s.includes(',')&&s.includes('.')){ s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(s.includes(',')) s=s.replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n);
}
const normKey=v=>{const s=String(v??'').trim();return /^\d+$/.test(s)?(s.replace(/^0+/,'')||'0'):s.toUpperCase();};
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseData(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
  const t=String(v).trim();let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  if(/^\d{5}$/.test(t))return parseData(Number(t));
  return '';
}
function diaRel(iso){
  if(!iso)return 'Sem data';
  const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);const h=new Date();h.setHours(0,0,0,0);
  const diff=Math.round((dt-h)/864e5);const wd=dt.toLocaleDateString('pt-BR',{weekday:'long'});
  const rel=diff===0?'Hoje':diff===1?'Amanhã':diff===-1?'Ontem':diff<0?'Atrasada':'';
  return {txt:wd.charAt(0).toUpperCase()+wd.slice(1)+', '+fdata(iso),rel,diff};
}
const fdata=iso=>iso?String(iso).slice(0,10).split('-').reverse().join('/'):'—';
function agora(){const d=new Date();return fdata(hoje())+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3800);}

/* ===================== estado ===================== */
const STATUS=[
  {k:'programada',t:'Programada',s:'aguardando separação'},
  {k:'separacao',t:'Em separação',s:'lista entregue ao separador'},
  {k:'separada',t:'Separada',s:'pronta para retirada'},
  {k:'retirada',t:'Retirada',s:'aguardando baixa no SAP'},
  {k:'baixada',t:'Baixada',s:'concluída'}];
const stIdx=k=>STATUS.findIndex(s=>s.k===k);
const ST={config:{empresa:'',base:'',endereco:'',centro:'',deposito:'',lote:'',depTransito:'',fornTransito:'',almoxarife:'',matricula:''},estoque:new Map(),estMeta:null,transito:[],trMeta:null,iq09:[],iqMeta:null,trafoFaltas:{},div:null,invSub:'diario',invTipo:'postes',obras:[],invs:[],
  tab:'painel',obraSel:null,aviso:null,loading:true,filtroStatus:'abertas',buscaObra:'',buscaEst:'',confirm:null,mode:'local',downloads:null};
let INV=null; // rascunho de inventário

/* ===================== armazenamento ===================== */
const LKEY='almox-obras-v1', DKEY='almox-inv-rascunho';
const chains={};
let filaGlobal=Promise.resolve();
function fila(path,fn){const run=async()=>{let ult;for(let t=0;t<3;t++){try{return await fn();}catch(e){ult=e;console.error(e);await new Promise(r=>setTimeout(r,600*(t+1)));}}throw ult;};
  const p=filaGlobal.then(run).catch(e=>{toast('Não foi possível salvar ('+(e?.code||e?.message||'erro')+'). Tente de novo.','bad');throw e;});
  filaGlobal=p.catch(()=>{});chains[path]=filaGlobal;return p;}
const Store={
  db:null,
  async init(){
    this.db=FB.db; ST.mode='db';
    ST.downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:'saved'};}};
  },
  async loadAll(){
    const plain=x=>x==null?x:JSON.parse(JSON.stringify(x));
    if(this.db){
      const db=this.db;
      const [cfg,meta,est,obras,invs,trm,tr,iqm,iq,tfal,rasc,dvp]=await Promise.all([db.doc('config/geral').get(),db.doc('config/estoque').get(),db.collection('estoque').get(),db.collection('obras').get(),db.collection('inventarios').get(),db.doc('config/transito').get(),db.collection('transito').get(),db.doc('config/iq09').get(),db.collection('iq09').get(),db.doc('config/trafoFaltas').get(),db.doc('rascunhos/diario').get(),db.doc('divergencias/postes').get()]);
      if(cfg.exists)Object.assign(ST.config,plain(cfg.data()));
      ST.estMeta=meta.exists?plain(meta.data()):null;
      ST.estoque=new Map();
      est.docs.map(d=>plain(d.data())).sort((a,b)=>a.i-b.i).forEach(c=>(c.itens||[]).forEach(it=>ST.estoque.set(normKey(it.codigo),it)));
      ST.obras=obras.docs.map(d=>plain(d.data()));
      ST.invs=invs.docs.map(d=>plain(d.data()));
      ST.trMeta=trm.exists?plain(trm.data()):null;ST.transito=tr.docs.map(d=>plain(d.data())).sort((a,b)=>a.i-b.i).flatMap(c=>c.itens||[]);
      ST.trafoFaltas=tfal.exists?(plain(tfal.data()).itens||{}):{};ST.div=dvp.exists?plain(dvp.data()):null;

const aberta=o=>o.status!=='baixada';
const ordem=(a,b)=>(a.data||'').localeCompare(b.data||'')||(a.criado||0)-(b.criado||0);
const r3=n=>Math.round((Number(n)||0)*1000)/1000;
const pend=it=>Math.max(0,r3((Number(it.qtd)||0)-(Number(it.ret)||0)));
const temSep=it=>it.separado!=null&&it.separado!=='';
const qtdReserva=(it,o)=>it.dev?0:(stIdx(o.status)>=2&&temSep(it))?Number(it.separado):pend(it);
const qtdSaida=it=>it.dev?0:temSep(it)?Number(it.separado):pend(it);
const qtdDoc=it=>it.dev?0:temSep(it)?Number(it.separado):Math.max(0,r3(Number(it.qtd)||0));

function reservasAntes(obra){
  const res={};
  for(const o of ST.obras.filter(aberta).sort(ordem)){ if(obra&&o.id===obra.id)break; for(const it of o.itens||[]){const k=normKey(it.codigo);res[k]=(res[k]||0)+qtdReserva(it,o);} }
  return res;
}
function reservasTotais(){const res={};for(const o of ST.obras.filter(aberta))for(const it of o.itens||[]){const k=normKey(it.codigo);res[k]=(res[k]||0)+qtdReserva(it,o);}return res;}
function analisar(obra){
  const res=aberta(obra)?reservasAntes(obra):{};const out=[];
  (obra.itens||[]).forEach((it,j)=>{
    if(it.dev)return;
    const k=normKey(it.codigo), est=ST.estoque.get(k), p=pend(it);
    const b={...it,_j:j,pend:p,ret:Number(it.ret)||0,descricao:it.descricao||est?.descricao||'',un:it.un||est?.un||'',saldo:est?Number(est.saldo)||0:null,porDep:est?.porDep||null,res:0,disp:null};
    if(p<=0){out.push({...b,sit:'ret'});return;}
    if(!aberta(obra)){out.push({...b,sit:'fim'});return;}
    if(!est){out.push({...b,sit:ST.estoque.size?'sem':'nsald'});return;}
    const disp=Math.max(0,b.saldo-(res[k]||0));
    out.push({...b,res:res[k]||0,disp,sit:disp>=p?'ok':disp>0?'parcial':'falta'});
  });
  return out;
}

function lerTexto(txt){
  const linhas=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!linhas.length)return [];
  const amostra=linhas.slice(0,5).join('\n');
  const d=amostra.includes('\t')?'\t':((amostra.match(/;/g)||[]).length>=(amostra.match(/,/g)||[]).length?';':',');
  return linhas.map(l=>l.split(d).map(c=>c.replace(/^"|"$/g,'').trim()));
}
function pontuar(m){
  let best=0,score=-1;const syns=IMP.cfg.campos.flatMap(c=>SYN[c.k].map(norm));
  m.slice(0,15).forEach((r,i)=>{const sc=r.filter(c=>{const n=norm(c);return n&&syns.some(s=>n===s||(s.length>3&&n.includes(s)));}).length;if(sc>score){score=sc;best=i;}});
  return {best,score};
}

  IMP.matriz=m;IMP.hdr=bestScore>0?best:-1;
  const hdr=IMP.hdr>=0?m[IMP.hdr].map(norm):[];
  const usados=new Set();
  for(const c of IMP.cfg.campos){
    let col=-1;
    for(const s of SYN[c.k].map(norm)){col=hdr.findIndex((h,j)=>!usados.has(j)&&h===s);if(col>=0)break;}

function lerArquivo(file){

const chaveProg=(reserva,data,equipe)=>normKey(reserva)+'|'+data+'|'+norm(equipe);
function statusDeTexto(t){const n=norm(t);if(!n)return null;if(n.includes('baix'))return 'baixada';if(n.includes('retir')||n.includes('entreg'))return 'retirada';if(n.includes('separad'))return 'separada';if(n.includes('separ'))return 'separacao';return null;}
function pareceCN52(){const h=(IMP?.matriz?.[IMP.hdr]||[]).map(x=>String(x??'').toLowerCase()).join('|');return /material/.test(h)&&/qtd|quantidade/.test(h);}
function importarProgramacao(){
  abrirImportador({titulo:'Programação de obras',bloquear:()=>pareceCN52()?'Este arquivo é a CN52N. Use o botão “Importar CN52N”.':'',botao:'Criar obras da programação',chave:'reserva',
    ajuda:'Planilha de programação no modelo PEP · RESERVA · DATA DE NECESSIDADE · EQUIPE · OBS · STATUS ALMOX. Cada linha vira uma retirada programada. Linhas repetidas (mesma reserva, data e equipe) são juntadas. Se a linha já existe no sistema, atualizo PEP, equipe e OBS sem mexer nos materiais.',
    campos:[{k:'pep',label:'PEP',req:true},{k:'reserva',label:'Reserva',req:true},{k:'data',label:'Data de necessidade',req:true,date:true},{k:'equipe',label:'Equipe'},{k:'obs',label:'OBS'},{k:'stalmox',label:'Status almox'}],
    resumo(rows){if(pareceCN52())return '<b style="color:var(--bad)">Este arquivo parece ser a CN52N (lista de materiais), não a programação. Cancele e use o botão “Importar CN52N”.</b>';const k=new Set(rows.map(r=>chaveProg(r.reserva,parseData(r.data),r.equipe)));const ex=ST.obras.filter(o=>k.has(chaveProg(o.reserva,o.data,o.equipe))).length;return `${k.size} retiradas distintas${ex?`, ${ex} já estão no sistema`:''}.`;},
    confirmar(rows,ex,arq){
      let novas=0,atual=0,i=0;const vistos=new Set();const agora=Date.now();
      for(const r of rows){
        const reserva=String(r.reserva).trim().replace(/\.0+$/,''), data=parseData(r.data)||hoje(), equipe=String(r.equipe||'').trim(), pep=String(r.pep||'').trim();
        const k=chaveProg(reserva,data,equipe); if(vistos.has(k))continue; vistos.add(k);
        let o=ST.obras.find(x=>chaveProg(x.reserva,x.data,x.equipe)===k);
        const st=statusDeTexto(r.stalmox);
        if(o){o.numero=pep||o.numero;o.pep=pep||o.pep;o.tipo=String(r.obs||'').trim();if(st&&stIdx(st)>stIdx(o.status))o.status=st;atual++;}
        else{o={id:uid(),origem:'prog',numero:pep||reserva,pep,reserva,data,equipe,tipo:String(r.obs||'').trim(),descricao:'',status:st||'programada',itens:[],criado:Date.now()+(i++)};ST.obras.push(o);novas++;}
        o.progEm=agora;if(arq)o.progArq=String(arq);
        Store.saveObra(o,0);
      }
      toast(`${novas} retirada(s) criada(s)${atual?`, ${atual} atualizada(s)`:''}. Agora importe as reservas para trazer os materiais.`);ST.tab='obras';ST.obraSel=null;ST.filtroStatus='abertas';render();
    }});
}
const chaveItem=i=>normKey(i.codigo)+(i.dev?'#D':'');
async function conferirGravacao(salvas){
  toast('Gravando materiais em '+salvas.length+' retirada(s)…');
  const falhas=[];
  for(const [o,p] of salvas){
    let ok=false;try{await p;const sn=await Store.db.doc('obras/'+o.id).get();const d=sn.exists?sn.data():null;ok=!!d&&!!o.cn52&&(d.itens||[]).length===(o.itens||[]).length&&d.cn52===o.cn52;}catch(e){console.error(e);}
    if(!ok){try{await Store.saveObra(o,0);const d=(await Store.db.doc('obras/'+o.id).get()).data();ok=!!d&&(d.itens||[]).length===(o.itens||[]).length;}catch(e){console.error(e);}}
    if(!ok)falhas.push(o.reserva+' ('+fdata(o.data)+')');
  }
  if(falhas.length){ST.aviso={titulo:'Atenção: '+falhas.length+' retirada(s) não foram gravadas',linhas:['Não consegui salvar os materiais em: '+falhas.join(', ')+'.','Recarregue a página e importe a CN52N de novo.']};render();toast('Algumas retiradas não foram gravadas.','bad');}
  else toast('Materiais gravados e conferidos em '+salvas.length+' retirada(s).');
}
function importarReservas(soObra){
  const filtra=()=>IMP&&(IMP.map.sl>=0||IMP.map.lote>=0);
  const valida=r=>String(r.sl||'').trim().toUpperCase()===DEP()&&String(r.lote||'').trim().toUpperCase()===LOTE();
  abrirImportador({titulo:soObra?'Materiais da reserva '+(soObra.reserva||''):'Materiais das reservas (CN52N)',botao:soObra?'Importar materiais':'Distribuir materiais',chave:'reserva',
    ajuda:`Exportação da CN52N: PEP, Material, Texto, UM, Qtd. retirada, Qtd. necessária, Storage location, Batch e Reserva. A separar = necessária − retirada. Só entram as linhas com depósito ${esc(DEP())} e lote ${esc(LOTE())}. Linhas com necessária negativa são devoluções e ficam num quadro à parte.${soObra?'':' Os materiais vão para todas as retiradas em aberto da reserva (todas as datas da programação); o que você já digitou em “Separado” é mantido.'}`,
    campos:[{k:'reserva',label:'Reserva',req:true},{k:'codigo',label:'Material',req:true},{k:'descricao',label:'Texto material'},{k:'un',label:'UM'},{k:'qtd',label:'Qtd. necessária',req:true,num:true},{k:'ret',label:'Qtd. retirada',num:true},{k:'sl',label:'Storage location'},{k:'lote',label:'Batch'},{k:'pep',label:'PEP (WBS)'},{k:'diagrama',label:'Diagrama de rede'}],
    extra:()=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="impTodas"> Incluir também linhas sem depósito ${esc(DEP())} / lote ${esc(LOTE())}</label>`,
    lerExtra:()=>({incluir:!!document.getElementById('impTodas')?.checked,filtra:filtra()}),
    resumo(rows){
      const ign=filtra()?rows.filter(r=>!valida(r)).length:0;const vr=filtra()?rows.filter(valida):rows;
      if(soObra){const n=vr.filter(r=>normKey(r.reserva)===normKey(soObra.reserva)).length;return `${n} linhas válidas da reserva ${soObra.reserva}${ign?`; ${ign} linhas sem ${DEP()}/${LOTE()} no arquivo serão ignoradas`:''}.`;}
      const rs=new Set(vr.map(r=>normKey(r.reserva)).filter(Boolean));const alvo=[...rs].filter(k=>ST.obras.some(o=>aberta(o)&&normKey(o.reserva)===k)).length;const nret=ST.obras.filter(o=>aberta(o)&&stIdx(o.status)<3&&rs.has(normKey(o.reserva))).length;
      return `${rs.size} reservas, ${alvo} com retirada programada (${nret} retiradas a preencher)${ign?`; ${ign} linhas sem ${DEP()}/${LOTE()} serão ignoradas`:''}.`;},
    confirmar(rows,ex){
      let ign=0;
      if(ex.filtra&&!ex.incluir)rows=rows.filter(r=>{const v=valida(r);if(!v)ign++;return v;});
      const g=new Map();for(const r of rows){const k=normKey(r.reserva);if(!k)continue;if(!g.has(k))g.set(k,[]);g.get(k).push(r);}
      const ok=[],sem=[],aguard=[],salvas=[];
      const aplicar=(alvo,rs)=>{
        const novos=agruparItens(rs);const old=new Map((alvo.itens||[]).map(i=>[chaveItem(i),i]));
        for(const n of novos){const o2=old.get(chaveItem(n));if(!o2)continue;if(temSep(o2))n.separado=o2.separado;if(o2.serial)n.serial=o2.serial;if(o2.motivoFalta)n.motivoFalta=o2.motivoFalta;}
        alvo.itens=novos;const d=rs.find(r=>String(r.diagrama||'').trim());if(d)alvo.diagrama=String(d.diagrama).trim();
        if(!alvo.pep){const pp=rs.find(r=>String(r.pep||'').trim());if(pp){alvo.pep=String(pp.pep).trim();alvo.numero=alvo.pep;}}
        alvo.cn52=new Date().toISOString();salvas.push([alvo,Store.saveObra(alvo,0)]);
        const pn=novos.filter(i=>!i.dev&&pend(i)>0).length,dv=novos.filter(i=>i.dev&&pend(i)>0).length;
        ok.push(`${alvo.reserva} (${fdata(alvo.data)}): ${pn} a separar${dv?`, ${dv} devolução(ões) pendente(s)`:''}`);
      };
      if(soObra){const rs=g.get(normKey(soObra.reserva))||(g.size===1?[...g.values()][0]:null);
        if(!rs){toast('Nenhuma linha da reserva '+soObra.reserva+' no arquivo.','bad');return;}aplicar(soObra,rs);}
      else for(const [k,rs] of g){
        const cand=ST.obras.filter(o=>aberta(o)&&normKey(o.reserva)===k).sort(ordem);
        if(!cand.length){sem.push(k);continue;}
        for(const c of cand){if(stIdx(c.status)>=3)aguard.push(`${k} (${fdata(c.data)})`);else aplicar(c,rs);}
      }
      ST.aviso={titulo:`Materiais atualizados em ${ok.length} retirada(s)`,linhas:[
        ...(ign?[`${ign} linhas sem ${DEP()}/${LOTE()} foram ignoradas.`]:[]),
        ...(aguard.length?[`Aguardando baixa no SAP, não atualizei: ${aguard.join(', ')}.`]:[]),
        ...(sem.length?[`Reservas que não estão na programação: ${sem.join(', ')}.`]:[]),
        ...ok]};
      if(soObra)toast('Materiais da reserva '+soObra.reserva+' atualizados.');else{ST.tab='obras';ST.obraSel=null;}
      render();
      if(Store.db&&salvas.length)conferirGravacao(salvas);
    }});
}

const ST_ALMOX={programada:'PROGRAMADA',separacao:'EM SEPARAÇÃO',separada:'SEPARADO',retirada:'RETIRADO',baixada:'BAIXADO'};
function statusAlmox(o){
  let t=ST_ALMOX[o.status]||'';
  if(stIdx(o.status)<3){const r=resumo(analisar(o));if(!r.total)t+=' - SEM MATERIAIS';else if(!r.n)t+=' - NADA PENDENTE';else if(r.falta||r.parcial)t+=' - FALTA '+(r.falta+r.parcial)+(r.falta+r.parcial>1?' ITENS':' ITEM');}
  return t;
}
async function exportarProgramacao(){
  if(!window.XLSX){toast('Gerador de Excel não carregou. Recarregue a página.','bad');return;}
  const lista=ST.obras.filter(o=>o.reserva&&!o.ex).sort(ordem);
  if(!lista.length){toast('Nenhuma retirada da programação para exportar.','bad');return;}
  const aoa=[['PEP','RESERVA','DATA DE NECESSIDADE','EQUIPE','OBS','STATUS ALMOX']];
  for(const o of lista){const [y,m,d]=(o.data||hoje()).split('-').map(Number);aoa.push([o.pep||o.numero,/^\d+$/.test(o.reserva)?Number(o.reserva):o.reserva,Date.UTC(y,m-1,d)/864e5+25569,o.equipe||'',o.tipo||'',statusAlmox(o)]);}
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  for(let i=2;i<=aoa.length;i++){const c=ws['C'+i];if(c){c.t='n';c.z='dd/mm/yyyy';}}
  ws['!cols']=[{wch:26},{wch:11},{wch:20},{wch:30},{wch:22},{wch:32}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Planilha1');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  await salvarArquivo('Prog_status_'+hoje()+'.xlsx',new Blob([buf]));
}

const BK_COLS=['estoque','obras','inventarios','transito','iq09','anexos'];

  const docs={};
  if(Store.db){
    for(const p of BK_DOCS){const sn=await Store.db.doc(p).get();if(sn.exists)docs[p]=JSON.parse(JSON.stringify(sn.data()));}
    for(const c of BK_COLS){const q=await Store.db.collection(c).get();q.docs.forEach(d=>{docs[c+'/'+(d.id||d.data().id)]=JSON.parse(JSON.stringify(d.data()));});}
  }else{
    docs['config/geral']={...ST.config};ST.obras.forEach(o=>docs['obras/'+o.id]=o);ST.invs.forEach(i=>docs['inventarios/'+i.id]=i);
  }
  return {app:'almoxarifado-osorio',versao:1,em:new Date().toISOString(),docs};
}
async function lerBackup(f){
  try{const j=JSON.parse(await f.text());if(!j||!j.docs||typeof j.docs!=='object')throw 0;
    ST._bk={...j,nObras:Object.keys(j.docs).filter(k=>k.startsWith('obras/')).length};render();}
  catch(e){toast('Arquivo de cópia de segurança inválido.','bad');}
}
async function restaurarBackup(){
  const bk=ST._bk;if(!bk)return;if(!Store.db){toast('Sem banco de dados conectado.','bad');return;}
  const ks=Object.keys(bk.docs);let n=0;toast('Restaurando '+ks.length+' documentos…');
  for(const k of ks){if(k.split('/').length!==2)continue;await fila(k,()=>Store.db.doc(k).set(bk.docs[k]));n++;}
  ST._bk=null;toast(n+' documentos restaurados.');await Store.loadAll();render();
}

async function comprimirImagem(file){

function itensExpedicao(o){return (o.itens||[]).filter(i=>!i.dev&&Number(i.qtd)>0&&(!i.sl&&!i.lote||(String(i.sl||'').toUpperCase()===DEP()&&String(i.lote||'').toUpperCase()===LOTE()))).sort((a,b)=>String(a.descricao).localeCompare(String(b.descricao),'pt-BR'));}
async function gerarExpedicao(o,saida=false){
  if(!window.JSZip)throw new Error('O gerador de Excel não carregou. Recarregue a página.');
  const zip=await JSZip.loadAsync(TPL_EXPEDICAO,{base64:true});
  let x=await zip.file('xl/worksheets/sheet1.xml').async('string');
  const itens=itensExpedicao(o), N0=15, CAP=37, n=itens.length, delta=Math.max(0,n-CAP), FIM=N0+CAP; // FIM = 52, primeira linha após itens
  const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num=(ref,s,v)=>`<c r="${ref}" s="${s}"><v>${v}</v></c>`;
  const str=(ref,s,v)=>`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  const val=(ref,s,v)=>{const t=String(v??'').trim();return /^\d{1,15}$/.test(t)?num(ref,s,t):str(ref,s,t);};
  const setCell=(ref,fn)=>{const re=new RegExp('<c r="'+ref+'"(?: [^>]*?)?(?:/>|>[\\s\\S]*?</c>)');x=x.replace(re,m=>fn((m.match(/ s="(\d+)"/)||[])[1]||'0'));};
  // cabeçalho
  if(o.data){const [y,m,d]=o.data.split('-').map(Number);setCell('J6',s=>num('J6',s,Date.UTC(y,m-1,d)/864e5+25569));}
  setCell('J10',s=>str('J10',s,o.pep||o.numero||''));
  if(o.equipe)setCell('E8',s=>str('E8',s,o.equipe));
  // linhas
  const ini=x.indexOf('<sheetData>')+11, fim=x.indexOf('</sheetData>');
  const rows=x.slice(ini,fim).match(/<row [^>]*?(?:\/>|>[\s\S]*?<\/row>)/g)||[];
  const rnum=r=>Number(r.match(/<row r="(\d+)"/)[1]);
  const shift=r=>r.replace(/(<row r=")(\d+)/,(m,a,b)=>a+(Number(b)+delta)).replace(/( r="[A-Z]+)(\d+)"/g,(m,a,b)=>a+(Number(b)+delta)+'"');

    const tail=M2Z.map(c=>`<c r="${c}${R}" s="36"/>`).join('');
    if(!it)return `<row r="${R}" spans="1:26" ht="30" hidden="1" customHeight="1" x14ac:dyDescent="0.45"><c r="A${R}" s="36"/><c r="B${R}" s="37"/><c r="C${R}" s="38"/>${'DEFGHIJKL'.split('').map(c=>`<c r="${c}${R}" s="39"/>`).join('')}${tail}</row>`;
    const q=r3(it.qtd);const ex=saida?qtdExpedida(it):q;
    return `<row r="${R}" spans="1:26" ht="30" customHeight="1" x14ac:dyDescent="0.45"><c r="A${R}" s="36"/>${num('B'+R,37,i+1)}${val('C'+R,38,o.reserva)}${val('D'+R,39,it.codigo)}${str('E'+R,39,it.descricao)}${str('F'+R,39,it.un)}${num('G'+R,39,q)}${num('H'+R,39,ex)}${saida?num('I'+R,39,ex):`<c r="I${R}" s="39"><f>ABS(G${R})</f><v>${q}</v></c>`}${it.serial?str('J'+R,39,it.serial):`<c r="J${R}" s="39"/>`}<c r="K${R}" s="39"/>${saida&&o.docSap&&ex>0?val('L'+R,39,String(o.docSap).trim()):`<c r="L${R}" s="39"/>`}${tail}</row>`;
  };
  const novas=[];

  const pos=novas.findIndex(r=>rnum(r)>=N0);

  // mesclagens, filtro, dimensão, visualização
  x=x.replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g,(m,c1,r1,c2,r2)=>{r1=+r1;r2=+r2;if(r1>=FIM){r1+=delta;r2+=delta;}return `<mergeCell ref="${c1}${r1}:${c2}${r2}"/>`;});
  x=x.replace(/<autoFilter[\s\S]*?<\/autoFilter>/,'').replace(/<autoFilter[^>]*\/>/,'');
  x=x.replace(/<dimension ref="A1:Z(\d+)"\/>/,(m,a)=>`<dimension ref="A1:Z${Number(a)+delta}"/>`);
  x=x.replace(/topLeftCell="[A-Z]+\d+"/,'topLeftCell="A1"').replace(/<selection [^>]*\/>/,'<selection activeCell="A1" sqref="A1"/>');
  zip.file('xl/worksheets/sheet1.xml',x);

  zip.remove('xl/calcChain.xml');
  let ct=await zip.file('[Content_Types].xml').async('string');zip.file('[Content_Types].xml',ct.replace(/<Override[^>]*calcChain[^>]*\/>/,''));
  let rel=await zip.file('xl/_rels/workbook.xml.rels').async('string');zip.file('xl/_rels/workbook.xml.rels',rel.replace(/<Relationship[^>]*calcChain[^>]*\/>/,''));
  let wbx=await zip.file('xl/workbook.xml').async('string');zip.file('xl/workbook.xml',wbx.replace(/<calcPr([^>]*?)\/>/,(m,a)=>`<calcPr${a.replace(/ fullCalcOnLoad="\d"/,'')} fullCalcOnLoad="1"/>`));
  return zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
}

function calcRel(){
  const dep=ST.rDep||'todos';const mats=[];
  for(const e of ST.estoque.values()){
    const q=dep==='todos'?Number(e.saldo)||0:Number(e.porDep?.[dep])||0;
    const v=dep==='todos'?Number(e.valor)||0:Number(e.valDep?.[dep])||0;
    if(q<=0&&v<=0)continue;mats.push({...e,q,v,fam:familia(e.codigo)});
  }
  const total=mats.reduce((s,m)=>s+m.v,0);
  mats.sort((a,b)=>b.v-a.v);let cum=0;
  mats.forEach((m,i)=>{const antes=total?cum/total*100:100;m.cls=antes<80?'A':antes<95?'B':'C';cum+=m.v;m.cum=total?cum/total*100:0;m.rank=i+1;m.pv=total?m.v/total*100:0;});
  const abc=['A','B','C'].map(c=>{const l=mats.filter(m=>m.cls===c);return {c,n:l.length,v:l.reduce((s,m)=>s+m.v,0)};});
  const famM=new Map();for(const m of mats){const f=famM.get(m.fam)||{fam:m.fam,v:0,n:0,q:0};f.v+=m.v;f.n++;famM.set(m.fam,f);}
  const fams=[...famM.values()].sort((a,b)=>b.v-a.v);
  const deps=(ST.estMeta?.deps||[]).map(d=>{let v=0,n=0;for(const e of ST.estoque.values()){const x=Number(e.valDep?.[d])||0;if(x>0){v+=x;n++;}}return {d,v,n};});
  // obras abertas
  let vRes=0,vFalta=0,nPend=0,nOk=0;const porData=new Map();
  for(const o of ST.obras.filter(o=>aberta(o)&&stIdx(o.status)<3)){
    for(const l of analisar(o)){if(l.sit==='ret')continue;const e=ST.estoque.get(normKey(l.codigo));const pr=preco(e);
      const vv=l.pend*pr;vRes+=vv;nPend++;if(l.sit==='ok')nOk++;
      if(l.sit==='falta'||l.sit==='parcial')vFalta+=Math.max(0,l.pend-(l.disp||0))*pr;
      const g=porData.get(o.data||'')||{data:o.data||'',v:0,n:0,ret:new Set()};g.v+=vv;g.n++;g.ret.add(o.id);porData.set(o.data||'',g);}
  }
  const datas=[...porData.values()].sort((a,b)=>a.data.localeCompare(b.data)).slice(-12);
  const postes=[...ST.estoque.values()].filter(e=>/^POSTE/i.test(e.descricao||'')&&Number(e.saldo)>0).sort((a,b)=>b.saldo-a.saldo);
  const trafos=[...ST.estoque.values()].filter(e=>String(e.codigo).startsWith('102')&&Number(e.saldo)>0).sort((a,b)=>b.saldo-a.saldo);
  return {dep,mats,total,abc,fams,deps,vRes,vFalta,nPend,nOk,datas,postes,trafos};
}

    const datas=os.map(o=>fdata(o.data).slice(0,5));const equipes=[...new Set(os.map(o=>o.equipe).filter(Boolean))].join(', ');const tipo=tipoObra(rep);

    for(const it of rep.itens){if(it.dev||!(Number(it.qtd)>0))continue;const est=ST.estoque.get(normKey(it.codigo));const desc=it.descricao||est?.descricao||'';const cat=catCrit(desc);if(!cat)continue;
      const q=Number(it.qtd)||0,pd=pend(it);

  }

const DEPS_TR=()=>(ST.config.depTransito||'OS01, OS03, OS04').split(/[,;\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
const FORN_OK=()=>(ST.config.fornTransito||'RES1').trim().toUpperCase();
const LIM_CRIT=15;
function diasDesde(iso){if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);const a=new Date(y,m-1,d);const h=new Date();h.setHours(0,0,0,0);return Math.round((h-a)/864e5);}
function linhasTransito(){
  return (ST.transito||[]).map(t=>{
    const dias=diasDesde(t.data);const crit=dias!=null&&dias>LIM_CRIT;const verif=String(t.forn||'').toUpperCase()!==FORN_OK();
    const e=ST.estoque.get(normKey(t.codigo));const v=(Number(t.qtd)||0)*preco(e);
    return {...t,dias,crit,verif,semData:dias==null,valorEst:v};
  });
}
function faltasPorMaterial(){
  const f=new Map();
  for(const o of ST.obras.filter(o=>aberta(o)&&stIdx(o.status)<3))for(const l of analisar(o)){
    if(l.sit!=='falta'&&l.sit!=='parcial'&&l.sit!=='sem')continue;const k=normKey(l.codigo);const x=f.get(k)||{q:0,obras:[]};x.q+=Math.max(0,l.pend-(l.disp||0));x.obras.push(o.reserva||o.numero);f.set(k,x);}
  return f;
}
function transitoPorMaterial(){const m=new Map();for(const t of ST.transito||[]){const k=normKey(t.codigo);m.set(k,(m.get(k)||0)+(Number(t.qtd)||0));}return m;}

  ws['!cols']=[{wch:10},{wch:10},{wch:9},{wch:12},{wch:13},{wch:6},{wch:9},{wch:11},{wch:42},{wch:5},{wch:10},{wch:10},{wch:14},{wch:24}];

const tilesPostes=r=>`<div class="tile"><span class="lbl">Itens</span><b>${r.n}</b></div><div class="tile"><span class="lbl">Contados</span><b>${r.c}</b></div><div class="tile ${r.dv?'bad':'ok'}"><span class="lbl">Divergentes</span><b>${r.dv}</b></div><div class="tile"><span class="lbl">Total contagem</span><b>${fmt(r.tc)}</b></div><div class="tile"><span class="lbl">Total sistêmico (${esc(DEP())})</span><b>${fmt(r.ts)}</b></div>`;
const tilesTrafos=r=>`<div class="tile"><span class="lbl">Equipamentos</span><b>${r.n}</b></div><div class="tile ok"><span class="lbl">Em estoque</span><b>${r.sim}</b></div><div class="tile ${r.nao?'bad':'ok'}"><span class="lbl">Faltando</span><b>${r.nao}</b></div><div class="tile ${r.pend?'warn':'ok'}"><span class="lbl">Não conferidos</span><b>${r.pend}</b></div>`;
function linhaPoste(it,i,ro){
  const dv=it.cont==null?null:it.cont-(it.sis||0);
  return `<tr class="${dv?'s-bad':''}"><td class="mono">${esc(it.codigo)}</td><td class="desc">${esc(it.descricao)}</td><td>UN</td>
  <td class="num">${ro?fmt(it.cont):`<input class="qty" id="pc-${i}_${ST.formRev||0}" data-pc="${i}" inputmode="numeric" placeholder="—" value="${it.cont==null?'':it.cont}" aria-label="Contagem">`}</td>
  <td class="num">${fmt(it.sis||0)}</td><td class="num" id="pd-${i}"><b style="${dv?'color:var(--bad)':''}">${dv==null?'—':fmtS(dv)}</b></td>
  <td id="pa-${i}">${dv==null?'<span class="pill neu">Não contado</span>':dv===0?'<span class="pill ok">CORRETO</span>':'<span class="pill bad">FALSO</span>'}</td>
  <td>${ro?esc(it.motivo||''):`<input id="pm-${i}" data-pm="${i}" list="dlMotP" value="${esc(it.motivo||'')}" placeholder="${dv?'Informe o motivo':''}" style="width:100%;min-width:200px">`}</td></tr>`;
}
function linhaTrafo(it,i,ro){
  const cls=it.est===false?'s-bad':it.est==null?'s-warn':'';
  return `<tr class="${cls}" id="tr-${i}"><td class="mono">${esc(it.codigo)}</td><td class="desc">${esc(it.descricao)}${it.pep?`<div class="sub">PEP ${esc(it.pep)}${it.st?' · '+esc(it.st):''}</div>`:''}${it.ant&&!ro?`<div class="sub" style="color:var(--warn)">Falta desde a contagem de ${fdata(it.ant)}</div>`:''}</td><td class="mono"><b>${esc(it.serial)}</b></td>
  <td>${ro?(it.est?'SIM':'NÃO'):`<div class="seg2"><button data-act="tr-est" data-i="${i}" data-v="1" aria-pressed="${it.est===true}">SIM</button><button data-act="tr-est" data-i="${i}" data-v="0" aria-pressed="${it.est===false}" class="no">NÃO</button></div>`}</td>

function painelUltimas(){

  if(!L.length)return '';
  return `<section class="panel"><div class="head"><div><span class="lbl">Histórico</span><h2>Últimas contagens</h2></div><span class="muted">Ficam guardadas para exportar de novo</span></div>

/* Guarda a contagem no histórico: uma por tipo e por dia (a mais recente substitui) */
function guardarContagem(t,D,final){
  const itens=JSON.parse(JSON.stringify(t==='postes'&&final?D.itens.map(i=>({...i,cont:i.cont??0})):D.itens));
  const ex=ST.invs.find(v=>v.tipo===t&&v.data===D.data);
  const inv={id:ex?.id||(t+uid()),tipo:t,criado:ex?.criado||Date.now(),atualizado:Date.now(),data:D.data,itens,status:final?'salva':(ex?.status==='salva'?'salva':'exportada')};
  if(ex)Object.assign(ex,inv);else ST.invs.push(inv);
  Store.saveInv(ex||inv);return ex||inv;
}
/* Excel da contagem diária */
async function xlsxContagem(v){
  const postes=v.tipo==='postes';
  const titulo=postes?'CONTAGEM DOS POSTES DISPONIVEIS EM ESTOQUE':'TRANSFORMADORES DISPONIVEIS EM ESTOQUE';
  const head=postes?['CÓDIGO','DESCRIÇÃO','UND','QUANT. CONTAGEM','QUANT. SISTÊMICO','DIVERGÊNCIA','AJUSTADO','MOTIVO']:['CÓDIGO','DESCRIÇÃO','UND','QUANTIDADE','SERIAL IE','EM ESTOQUE','FALTA','MOTIVO','DEPÓSITO','ELEMENTO PEP'];
  const num=c=>/^\d+$/.test(String(c))?Number(c):c;
  const body=postes?v.itens.map(i=>{const c=i.cont??0;const dv=c-(i.sis||0);return [num(i.codigo),i.descricao,'UN',c,i.sis||0,dv,dv===0?'CORRETO':'FALSO',(i.motivo||'').toUpperCase()];})
    :v.itens.map(i=>[num(i.codigo),i.descricao,'UND',1,i.serial,i.est===false?'NÃO':i.est===true?'SIM':'NÃO CONFERIDO',i.est===false?'SIM':'NÃO',(i.motivo||(i.est===false?'':'OK')).toUpperCase(),i.dep||'',i.pep||'']);
  const aoa=[[(ST.config.empresa||'Grupo Setup').toUpperCase()+' · '+(ST.config.base||'Almoxarifado Osório').toUpperCase()],[titulo],['CONFERIDO EM: '+fdata(v.data)],[],head,...body];
  if(postes)aoa.push(['TOTAL','','',v.itens.reduce((s,i)=>s+(i.cont??0),0),v.itens.reduce((s,i)=>s+(i.sis||0),0),v.itens.reduce((s,i)=>s+((i.cont??0)-(i.sis||0)),0),'','']);
  else{const nao=v.itens.filter(i=>i.est===false).length;aoa.push([],['TOTAL EQUIPAMENTOS',v.itens.length],['EM ESTOQUE',v.itens.length-nao],['FALTA',nao]);}
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:head.length-1}},{s:{r:1,c:0},e:{r:1,c:head.length-1}},{s:{r:2,c:0},e:{r:2,c:head.length-1}}];
  ws['!cols']=postes?[{wch:11},{wch:42},{wch:5},{wch:16},{wch:16},{wch:12},{wch:11},{wch:32}]:[{wch:11},{wch:42},{wch:5},{wch:11},{wch:18},{wch:14},{wch:7},{wch:28},{wch:9},{wch:24}];
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:4,c:0},e:{r:4+body.length,c:head.length-1}})};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,postes?'Postes':'Transformadores');
  if(!postes){const f=v.itens.filter(i=>i.est===false).map(i=>({'Código':num(i.codigo),'Descrição':i.descricao,'Serial IE':i.serial,'Motivo':(i.motivo||'').toUpperCase(),'Depósito':i.dep||''}));if(f.length){const w2=XLSX.utils.json_to_sheet(f);w2['!cols']=[{wch:11},{wch:42},{wch:18},{wch:28},{wch:9}];XLSX.utils.book_append_sheet(wb,w2,'Faltas');}}
  const nome=(postes?'Contagem de postes - Osório - ':'Contagem de transformadores Osório - ')+fdata(v.data).replace(/\//g,'.')+'.xlsx';
  return salvarArquivo(nome,new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
}

  const W=doc.internal.pageSize.getWidth();const postes=v.tipo==='postes';

    doc.setFontSize(9.5);doc.text('CONFERIDO EM: '+fdata(v.data),(x0+x1)/2,152,{align:'center'});
  };
  const head=postes?[['CÓDIGO','DESCRIÇÃO','UND','QUANT. CONTAGEM','QUANT. SISTÊMICO','DIVERGÊNCIA','AJUSTADO','MOTIVO']]:[['CÓDIGO','DESCRIÇÃO','UND','QUANTIDADE','SERIAL IE','EM ESTOQUE','FALTA','MOTIVO']];
  const body=postes?v.itens.map(i=>{const c=i.cont??0;const dv=c-(i.sis||0);return [i.codigo,i.descricao,'UN',String(c),String(i.sis||0),String(dv),dv===0?'CORRETO':'FALSO',(i.motivo||'').toUpperCase()];})

/* ===================== Comparativo diário ===================== */
function fontesComp(tipo){
  const L=[...ST.invs].filter(v=>v.tipo===tipo).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.criado-a.criado).map(v=>({id:v.id,rot:'Contagem de '+fdata(v.data),v}));
  if(INVD[tipo])L.unshift({id:'draft',rot:'Contagem em andamento ('+fdata(INVD[tipo].data)+')',v:{tipo,...INVD[tipo]}});
  return L;
}
function difTrafos(A,B){
  const a=new Map(A.itens.map(i=>[String(i.serial).toUpperCase(),i])),b=new Map(B.itens.map(i=>[String(i.serial).toUpperCase(),i]));
  const out={resolvidos:[],novas:[],continuam:[],entraram:[],sairam:[],pend:[]};
  for(const [k,y] of b){const x=a.get(k);
    if(!x){out.entraram.push({x:null,y});continue;}
    if(y.est==null){out.pend.push({x,y});continue;}
    if(x.est===false&&y.est===true)out.resolvidos.push({x,y});
    else if(x.est!==false&&y.est===false)out.novas.push({x,y});
    else if(x.est===false&&y.est===false)out.continuam.push({x,y,mudou:(x.motivo||'')!==(y.motivo||'')});}
  for(const [k,x] of a)if(!b.has(k))out.sairam.push({x,y:null});
  return out;
}
function difPostes(A,B){
  const a=new Map(A.itens.map(i=>[normKey(i.codigo),i])),b=new Map(B.itens.map(i=>[normKey(i.codigo),i]));
  const ks=[...new Set([...a.keys(),...b.keys()])];const out={tratados:[],novas:[],mudou:[],iguais:[],corretos:[]};
  for(const k of ks){const x=a.get(k),y=b.get(k);const dx=x?(x.cont??0)-(x.sis||0):null,dy=y?(y.cont??0)-(y.sis||0):null;
    const r={k,x,y,dx,dy,cod:(y||x).codigo,desc:(y||x).descricao};
    if(y&&y.cont==null){continue;}
    if(dx&&dy===0)out.tratados.push(r);else if(!dx&&dy)out.novas.push(r);
    else if(dx&&dy&&(dx!==dy||(x.motivo||'')!==(y.motivo||'')||x.cont!==y.cont))out.mudou.push(r);
    else if(dx&&dy)out.iguais.push(r);else out.corretos.push(r);}
  return out;
}

  const tab=lista=>lista.length?`<div class="tablebox"><table><thead><tr><th>Código</th><th>Descrição</th><th class="num">Contagem ${fdata(A.data).slice(0,5)}</th><th class="num">Contagem ${fdata(B.data).slice(0,5)}</th><th class="num">Sistêmico ${fdata(A.data).slice(0,5)}</th><th class="num">Sistêmico ${fdata(B.data).slice(0,5)}</th><th class="num">Divergência</th><th>Motivo</th></tr></thead><tbody>${lista.map(r=>`<tr><td class="mono">${esc(r.cod)}</td><td class="desc">${esc(r.desc)}</td><td class="num">${r.x?fmt(r.x.cont??0):'—'}</td><td class="num"><b>${r.y?fmt(r.y.cont??0):'—'}</b></td><td class="num muted">${r.x?fmt(r.x.sis||0):'—'}</td><td class="num muted">${r.y?fmt(r.y.sis||0):'—'}</td><td class="num">${r.dx==null?'—':fmtS(r.dx)} → <b style="color:var(--${r.dy?'bad':'ok'})">${r.dy==null?'—':fmtS(r.dy)}</b></td><td>${esc(r.x?.motivo||'')}${(r.x?.motivo||'')!==(r.y?.motivo||'')?` → <b>${esc(r.y?.motivo||'—')}</b>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhum.</p>';
  return seg+ctrl+`<div class="kpis cmp">

    const obras=ST.obras.filter(o=>aberta(o)&&stIdx(o.status)<3&&(o.data||'')===d.v).sort(ordem);

    return {lbl:'Programação',tit:(diaRel(d.v).txt||'Sem data'),html:`<div class="dk"><div><span class="lbl">Valor a separar</span><b>${fmtRc(rows.reduce((s,x)=>s+x.v,0))}</b></div><div><span class="lbl">Retiradas</span><b>${rows.length}</b></div></div>
      <div class="tablebox"><table><thead><tr><th>PEP / Reserva</th><th>Equipe</th><th class="num">Itens</th><th class="num">Valor</th><th>Disponibilidade</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${linkObra(x.o)}</td><td>${esc(x.o.equipe||'')}</td><td class="num">${x.r.n}</td><td class="num">${fmtRc(x.v)}</td><td>${x.r.falta||x.r.parcial?`<span class="pill ${x.r.falta?'bad':'warn'}">${x.r.falta+x.r.parcial} com falta</span>`:'<span class="pill ok">Completa</span>'}</td></tr>`).join('')}</tbody></table></div>`};
  }
  if(d.k==='kpi'){
    const I=itensAbertos();
    if(d.v==='reservado'){const g=new Map();for(const x of I){const r=g.get(x.o.id)||{o:x.o,v:0,n:0};r.v+=x.l.pend*x.pr;r.n++;g.set(x.o.id,r);}const L=[...g.values()].sort((a,b)=>b.v-a.v);
      return {lbl:'Indicador',tit:'Reservado para obras abertas',html:`<div class="dk"><div><span class="lbl">Total</span><b>${fmtRc(L.reduce((s,r)=>s+r.v,0))}</b></div><div><span class="lbl">Retiradas</span><b>${L.length}</b></div></div>
      <div class="tablebox"><table><thead><tr><th>PEP / Reserva</th><th>Data</th><th class="num">Itens</th><th class="num">Valor</th></tr></thead><tbody>${L.map(r=>`<tr><td>${linkObra(r.o)}</td><td>${fdata(r.o.data)}</td><td class="num">${r.n}</td><td class="num">${fmtR(r.v)}</td></tr>`).join('')}</tbody></table></div>`};}
    const g=new Map();for(const x of I){if(!x.falta&&x.l.sit!=='sem')continue;const k=normKey(x.l.codigo);const r=g.get(k)||{cod:x.l.codigo,desc:x.l.descricao,un:x.l.un,q:0,v:0,obras:new Set()};r.q+=x.falta||x.l.pend;r.v+=(x.falta||x.l.pend)*x.pr;r.obras.add(x.o.reserva||x.o.numero);g.set(k,r);}
    const trM=transitoPorMaterial();const L=[...g.values()].sort((a,b)=>b.v-a.v||b.q-a.q);
    return {lbl:'Indicador',tit:d.v==='falta'?'Materiais em falta':'Itens sem saldo na programação',html:`<div class="dk"><div><span class="lbl">Valor em falta</span><b class="bad">${fmtRc(L.reduce((s,r)=>s+r.v,0))}</b></div><div><span class="lbl">Materiais</span><b>${L.length}</b><span class="muted">${L.filter(r=>trM.get(normKey(r.cod))).length} com material em trânsito</span></div></div>
      <div class="tablebox"><table><thead><tr><th>Material</th><th class="num">Falta</th><th class="num">Em trânsito</th><th class="num">Valor</th><th>Reservas</th></tr></thead><tbody>${L.map(r=>`<tr><td>${linkMat(r.cod,`<span class="mono">${esc(r.cod)}</span><br>${esc(r.desc)}`)}</td><td class="num">${fmt(r.q)} ${esc(r.un)}</td><td class="num">${trM.get(normKey(r.cod))?`<b style="color:var(--accent-hi)">${fmt(trM.get(normKey(r.cod)))}</b>`:'—'}</td><td class="num">${r.v?fmtR(r.v):'—'}</td><td class="muted">${esc([...r.obras].join(', '))}</td></tr>`).join('')}</tbody></table></div>`};
  }
  return {lbl:'',tit:'',html:''};
}

const EXEC=[['','Pendente de apontamento'],['conforme','Saiu conforme'],['parcial','Saiu parcial'],['nao','Não saiu'],['reprog','Reprogramada']];
const ehExtra=o=>o.origem==='extra';
function execDe(o){if(o.exec)return o.exec;if(stIdx(o.status)>=3)return o.sepConf?.faltas?'parcial':'conforme';return '';}
function diaAderencia(d){
  const prog=ST.obras.filter(o=>!ehExtra(o)&&(o.data||'')===d).sort(ordem);const extra=ST.obras.filter(o=>ehExtra(o)&&(o.data||'')===d).sort(ordem);
  const ex=prog.map(execDe);const real=ex.filter(x=>x==='conforme'||x==='parcial').length,nao=ex.filter(x=>x==='nao'||x==='reprog').length,pend=ex.filter(x=>!x).length;
  const extraReal=extra.filter(o=>execDe(o)==='conforme'||execDe(o)==='parcial'||stIdx(o.status)>=2).length;
  return {d,prog,extra,real,nao,pend,conf:ex.filter(x=>x==='conforme').length,parc:ex.filter(x=>x==='parcial').length,ader:(real+nao)?real/(real+nao)*100:null,extraReal};
}
function pillExec(x,extra){const m={conforme:['ok',extra?'Saiu':'Saiu conforme'],parcial:['warn','Saiu parcial'],nao:['bad','Não saiu'],reprog:['warn','Reprogramada'],'':['neu','Pendente']};const [c,t]=m[x||''];return `<span class="pill ${c}">${t}</span>`;}

  <datalist id="dlExecM">${['Equipe não compareceu','Falta de material','Chuva / condições climáticas','Obra reprogramada pela Equatorial','Prioridade operacional','Emergência','Antecipada','Inserida pela programação do dia'].map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
  <section class="panel"><div class="head"><div><span class="lbl">Programação</span><h2>Programadas para ${fdata(d)}</h2></div><span class="pill neu">${A.prog.length}</span></div>

    <div class="fields addx"><div class="field"><label class="lbl" for="axPep">PEP</label><input id="axPep" placeholder="RS-..."></div><div class="field"><label class="lbl" for="axRes">Reserva</label><input id="axRes" inputmode="numeric"></div><div class="field"><label class="lbl" for="axData">Data programada</label><input id="axData" type="date" value="${esc(ST.adData||hoje())}"></div><div class="field"><label class="lbl" for="axEq">Equipe</label><input id="axEq" placeholder="Opcional"></div>
      <div class="field"><label class="lbl" for="axSt">Etapa</label><select id="axSt">${STATUS.filter(s=>s.k!=='baixada').map(s=>`<option value="${s.k}" ${s.k==='separada'?'selected':''}>${s.t}</option>`).join('')}</select></div><div class="field" style="grid-column:span 2"><label class="lbl" for="axMot">Motivo da inclusão</label><input id="axMot" list="dlExecM" placeholder="Ex.: Inserida pela programação do dia"></div></div>

async function xlsxAderencia(){

    for(const o of h.extra)det.push({'Dia':fdata(h.d),'Tipo':'FORA DA PROGRAMAÇÃO','PEP':o.pep||o.numero,'Reserva':/^\d+$/.test(o.reserva||'')?Number(o.reserva):o.reserva||'','Equipe':o.equipe||'','OBS':o.tipo||'','Etapa':STATUS[stIdx(o.status)]?.t||'','Execução':stIdx(o.status)>=2?'Saiu':'Pendente','Motivo / observação':o.execMotivo||''});}
  const wb=XLSX.utils.book_new();const w1=XLSX.utils.json_to_sheet(res);w1['!cols']=[{wch:11},{wch:12},{wch:15},{wch:14},{wch:11},{wch:10},{wch:19},{wch:13}];
  const w2=XLSX.utils.json_to_sheet(det.length?det:[{'Dia':'Sem dados'}]);w2['!cols']=[{wch:11},{wch:21},{wch:26},{wch:10},{wch:26},{wch:20},{wch:13},{wch:22},{wch:36}];w2['!autofilter']={ref:w2['!ref']};

function salvarDiv(){if(!ST.div)return;if(!Store.db)return Store.local();const d=JSON.parse(JSON.stringify(ST.div));return fila('divergencias/postes',()=>Store.db.doc('divergencias/postes').set(d));}
function precoDiv(it){if(it.preco!=null&&it.preco!=='')return Number(it.preco);return preco(ST.estoque.get(normKey(it.codigo)));}
function linhasDiv(){const L=(ST.div?.itens||[]).map((it,i)=>{const dv=(it.div!=null&&it.div!=='')?Number(it.div):(Number(it.cont)||0)-(Number(it.sis)||0);const pr=precoDiv(it);return {...it,_i:i,dv,pr,v:dv*pr,st:it.st||'aberto'};}).filter(l=>l.dv!==0);
  L.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));const tot=L.reduce((s,l)=>s+Math.abs(l.v),0);let ac=0;L.forEach(l=>{ac+=Math.abs(l.v);l.pct=tot?Math.abs(l.v)/tot*100:0;l.acum=tot?ac/tot*100:0;});return L;}
function importarDivPostes(){
  abrirImportador({titulo:'Inventário de postes (divergências)',botao:'Carregar divergências',
    ajuda:'Planilha da contagem com CÓDIGO, DESCRIÇÃO, UND, QUANT. CONTAGEM, QUANT. SISTÊMICO e DIVERGÊNCIA. O valor de cada divergência é calculado pelo preço médio da MB52 (valor ÷ saldo). Ao carregar, a tratativa atual é substituída, mas status, ações e responsáveis dos postes que continuam na lista são mantidos.',
    campos:[{k:'codigo',label:'Código',req:true},{k:'descricao',label:'Descrição'},{k:'un',label:'UND'},{k:'pcont',label:'Quant. contagem',req:true,num:true},{k:'psis',label:'Quant. sistêmico',req:true,num:true},{k:'pdiv',label:'Divergência',num:true}],
    extra:()=>`<div class="fields"><div class="field"><label class="lbl" for="divData">Data da contagem</label><input type="date" id="divData" value="${hoje()}"></div></div>`,
    lerExtra:()=>({data:document.getElementById('divData')?.value||hoje()}),
    confirmar(rows,ex,arq){
      const ant=new Map((ST.div?.itens||[]).map(i=>[normKey(i.codigo),i]));
      const itens=rows.map(r=>{const c=String(r.codigo).trim();const o=ant.get(normKey(c))||{};const cont=parseNum(r.pcont)||0,sis=parseNum(r.psis)||0;const dv=parseNum(r.pdiv);
        return {codigo:c,descricao:String(r.descricao||ST.estoque.get(normKey(c))?.descricao||'').trim(),un:String(r.un||'UN').trim(),cont,sis,div:isNaN(dv)?cont-sis:dv,st:o.st||'aberto',acao:o.acao||'',resp:o.resp||'',obs:o.obs||'',preco:o.preco??null};});
      ST.div={data:ex.data,arquivo:arq||'',importado:new Date().toISOString(),itens};salvarDiv();
      const L=linhasDiv();toast(`${L.length} postes com divergência · ${fmtR(L.reduce((s,l)=>s+l.v,0))}.`);ST.tab='divergencias';render();
    }});
}
function vDivergencias(){

  if(!ST.div)return head+`<div class="empty"><h2>Nenhuma contagem carregada</h2><p>Importe a planilha do inventário de postes (código, contagem, sistêmico, divergência). O sistema calcula o valor de cada divergência pelo preço da MB52 e organiza a tratativa por valor.</p><div class="actions"><button class="btn pri" data-act="div-imp">Importar contagem</button></div></div>`;

  const res=L.filter(l=>l.st==='resolvido'||l.st==='justificado');const vRes=res.reduce((s,l)=>s+Math.abs(l.v),0);const prog=vAbs?vRes/vAbs*100:0;
  const semPreco=L.filter(l=>!l.pr).length;
  const vis=L.filter(l=>f==='todos'||(f==='pend'&&l.st!=='resolvido'&&l.st!=='justificado')||l.st===f);

  <div class="kpis">
    <div class="kpi hero"><span class="lbl">Valor total das divergências</span><b style="color:var(--bad)">${fmtRc(vAbs)}</b><span class="muted">${fmtR(vF+vS)} líquido · ${L.length} postes · ${fmt(L.reduce((s,l)=>s+l.dv,0))} un</span></div>
    <div class="kpi"><span class="lbl">Falta (contagem &lt; sistema)</span><b class="bad">${fmtRc(Math.abs(vF))}</b><span class="muted">${falta.length} postes · ${fmt(Math.abs(falta.reduce((s,l)=>s+l.dv,0)))} un</span></div>
    <div class="kpi"><span class="lbl">Sobra (contagem &gt; sistema)</span><b style="${vS?'color:var(--warn)':''}">${fmtRc(vS)}</b><span class="muted">${sobra.length} postes · ${fmt(sobra.reduce((s,l)=>s+l.dv,0))} un</span></div>
    <div class="kpi"><span class="lbl">Tratado</span><b>${pct(prog,0)}</b><div class="meter"><span style="width:${prog}%;background:var(--ok)"></span></div><span class="muted">${fmtRc(vRes)} de ${fmtRc(vAbs)} · ${res.length} de ${L.length} postes</span></div>
  </div>
  <section class="panel"><div class="head"><div><span class="lbl">Por valor</span><h2>Onde está o dinheiro</h2></div><span class="muted">${L.filter(l=>l.acum<=80).length+1>L.length?L.length:L.filter(l=>l.acum<80).length+1} postes somam 80% do valor · clique para ver o material</span></div>
    <div class="hb">${L.map(l=>`<div class="hb-row clk" data-act="drill" data-k="mat" data-v="${esc(l.codigo)}" role="button" tabindex="0" data-tip="${esc(`${l.codigo} · ${l.descricao}\n${fmtS(l.dv)} un × ${fmtR(l.pr)}\n${fmtR(l.v)} · ${pct(l.pct)} do total`)}"><span class="hb-l">${esc(l.descricao)}</span><span class="hb-t"><span class="hb-b" style="width:${Math.max(.6,Math.abs(l.v)/mx*100)}%;background:${l.dv<0?'var(--bad)':'var(--warn)'};opacity:${l.st==='resolvido'||l.st==='justificado'?.35:1}"></span><span class="hb-v">${fmtRc(Math.abs(l.v))}</span></span></div>`).join('')}</div></section>
  <div class="head"><div class="chips">${[['todos','Todos',L.length],['pend','Pendentes',L.filter(l=>l.st!=='resolvido'&&l.st!=='justificado').length],...ST_DIV.map(([k,t])=>[k,t,L.filter(l=>l.st===k).length])].map(([k,t,n])=>`<button class="chip" data-act="div-f" data-v="${k}" aria-pressed="${f===k}">${t} · ${n}</button>`).join('')}</div></div>
  <datalist id="dlAcaoDiv">${ACOES_DIV.map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
  <div class="tablebox"><table><thead><tr><th>Código</th><th>Descrição</th><th class="num">Contagem</th><th class="num">Sistêmico</th><th class="num">Diverg.</th><th class="num">Preço unit.</th><th class="num">Valor</th><th class="num">% acum.</th><th>Status</th><th>Ação / motivo</th><th>Responsável</th></tr></thead><tbody>
  ${vis.map(l=>`<tr class="${l.st==='resolvido'||l.st==='justificado'?'done':l.dv<0?'s-bad':'s-warn'}"><td class="mono"><button class="lnk" data-act="drill" data-k="mat" data-v="${esc(l.codigo)}"><span class="mono">${esc(l.codigo)}</span></button></td><td class="desc">${esc(l.descricao)}</td>
    <td class="num">${fmt(l.cont)}</td><td class="num">${fmt(l.sis)}</td><td class="num"><b style="color:var(--${l.dv<0?'bad':'warn'})">${fmtS(l.dv)}</b></td>
    <td class="num">${l.pr&&(l.preco==null||l.preco==='')?fmtR(l.pr):`<input class="qty" id="dp-${l._i}" data-dp="${l._i}" inputmode="decimal" placeholder="R$" value="${l.preco!=null&&l.preco!==''?String(l.preco).replace('.',','):''}">`}</td>
    <td class="num"><b>${fmtR(l.v)}</b></td><td class="num muted">${pct(l.acum,0)}</td>
    <td><select id="ds-${l._i}" data-ds="${l._i}" class="st-sel ${l.st==='resolvido'?'st-separada':l.st==='justificado'?'st-separacao':l.st==='tratamento'?'st-retirada':'st-nao'}">${ST_DIV.map(([k,t])=>`<option value="${k}" ${l.st===k?'selected':''}>${t}</option>`).join('')}</select></td>
    <td><input id="da-${l._i}" data-da="${l._i}" list="dlAcaoDiv" value="${esc(l.acao||'')}" placeholder="Ação ou motivo" style="min-width:200px;width:100%"></td>
    <td><input id="dr-${l._i}" data-dr2="${l._i}" value="${esc(l.resp||'')}" placeholder="Nome" style="width:120px"></td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="4"><b>TOTAL</b></td><td class="num"><b>${fmtS(vis.reduce((s,l)=>s+l.dv,0))}</b></td><td></td><td class="num"><b>${fmtR(vis.reduce((s,l)=>s+l.v,0))}</b></td><td colspan="4"></td></tr></tfoot></table></div>
  <p class="note">Ordenado do maior para o menor valor: tratando os primeiros da lista você resolve a maior parte do valor. Status “Resolvido” ou “Justificado” conta como tratado.</p>`;
}
async function xlsxDiv(){
  const L=linhasDiv();const num=c=>/^\d+$/.test(String(c))?Number(c):c;
  const rows=L.map(l=>({'Código':num(l.codigo),'Descrição':l.descricao,'UND':l.un||'UN','Quant. contagem':l.cont,'Quant. sistêmico':l.sis,'Divergência':l.dv,'Preço unit. (R$)':Math.round(l.pr*100)/100,'Valor divergência (R$)':Math.round(l.v*100)/100,'% do total':Math.round(l.pct*10)/1000,'% acumulado':Math.round(l.acum*10)/1000,'Status':(ST_DIV.find(s=>s[0]===l.st)||ST_DIV[0])[1].toUpperCase(),'Ação / motivo':l.acao||'','Responsável':l.resp||''}));
  rows.push({'Código':'TOTAL','Divergência':L.reduce((s,l)=>s+l.dv,0),'Valor divergência (R$)':Math.round(L.reduce((s,l)=>s+l.v,0)*100)/100});
  const ws=XLSX.utils.json_to_sheet(rows);const rg=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=rg.e.r;r++){for(const c of [6,7]){const x=ws[XLSX.utils.encode_cell({r,c})];if(x)x.z='#,##0.00';}for(const c of [8,9]){const x=ws[XLSX.utils.encode_cell({r,c})];if(x)x.z='0.0%';}}
  ws['!cols']=[{wch:11},{wch:40},{wch:5},{wch:15},{wch:15},{wch:11},{wch:15},{wch:20},{wch:10},{wch:11},{wch:15},{wch:32},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Divergências postes');
  return salvarArquivo('Divergencias_postes_'+(ST.div.data||hoje())+'.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
}

function sincronizarCampos(){
  const o=ST.obraSel&&ST.tab==='obras'?ST.obras.find(x=>x.id===ST.obraSel):null;
  const fix=()=>{if(!o)return;main.querySelectorAll('input[data-is]').forEach(i=>{if(document.activeElement===i)return;const it=o.itens[Number(i.dataset.is)];const v=it&&it.separado!=null&&it.separado!==''?String(it.separado).replace('.',','):'';if(i.value!==v)i.value=v;});
    main.querySelectorAll('input[data-sr]').forEach(i=>{if(document.activeElement===i)return;const it=o.itens[Number(i.dataset.sr)];const v=(it&&it.serial)||'';if(i.value!==v)i.value=v;});
    main.querySelectorAll('input[data-mf]').forEach(i=>{if(document.activeElement===i)return;const it=o.itens[Number(i.dataset.mf)];const v=(it&&it.motivoFalta)||'';if(i.value!==v)i.value=v;});
    main.querySelectorAll('input[data-of]').forEach(i=>{if(document.activeElement===i||i.type==='date')return;const v=o[i.dataset.of]==null?'':String(o[i.dataset.of]);if(i.value!==v)i.value=v;});};

}

function selSt(o){

  return `<select id="st-${o.id}" class="st-sel st-${o.status}" data-stsel="${o.id}" aria-label="Etapa da retirada ${esc(o.reserva||'')}">${STATUS.filter(s=>s.k!=='baixada').map(s=>`<option value="${s.k}" ${s.k===o.status?'selected':''}>${s.t}</option>`).join('')}</select>`;

function repeticoes(o){const k=normKey(o.reserva||'')||String(o.pep||o.numero||'').trim().toUpperCase();if(!k)return [];

function resumoConf(L){let c=0,p=0,n=0,v=0,sm=0;for(const l of L){if(l.separado==null||l.separado===''){v++;continue;}const s=Number(l.separado);if(s>=l.pend)c++;else{if(s>0)p++;else n++;if(!(l.motivoFalta||'').trim())sm++;}}return {c,p,n,v,sm,falt:p+n};}
function ehTrafo(it){return catCrit(it.descricao||ST.estoque.get(normKey(it.codigo))?.descricao)==='Transformadores';}
function seriaisIQ(cod){const k=normKey(cod);return [...new Set((ST.iq09||[]).filter(e=>normKey(e.codigo)===k&&e.serial).map(e=>e.serial))];}

    <td class="num" id="fal-${j}">${f==null?'<span class="muted">—</span>':f?`<b style="color:var(--bad)">${fmt(f)}</b>`:'<span class="pill ok">0</span>'}</td>
    <td>${ok?esc(l.motivoFalta||''):`<input id="mf-${o.id}-${j}" data-mf="${j}" list="dlMotSep" value="${esc(l.motivoFalta||'')}" placeholder="${f?'Informe o motivo':''}" style="width:100%;min-width:190px">`}</td>${temTr?`<td>${ehTrafo(l)?`<input id="sr-${o.id}-${j}" data-sr="${j}" list="dlSer-${esc(normKey(l.codigo))}" value="${esc(l.serial||'')}" placeholder="Nº de série${(s??l.pend)>1?' (separe por vírgula)':''}" style="width:100%;min-width:200px" class="mono">`:'<span class="muted">—</span>'}</td>`:''}</tr>`;};

    ${ok?'':`<div class="actions">${cf==='conf-vazio'?`<div class="confirm ok"><span>${R.v} ${R.v>1?'itens estão':'item está'} sem quantidade separada. Considerar como separados completos?</span><button class="btn pri" data-act="conf-ok" data-full="1">Sim, confirmar</button><button class="btn" data-act="cancel">Voltar e preencher</button></div>`:`<button class="btn pri" data-act="conf-ok">Confirmar separação</button>`}

function invResumo(itens){

    const L=analisar(o);const l=L.find(x=>x._j===j);if(l){const s=l.separado==null?null:Number(l.separado);const f=s==null?null:Math.max(0,r3(l.pend-s));
      const c=document.getElementById('fal-'+j);if(c)c.innerHTML=f==null?'<span class="muted">—</span>':f?`<b style="color:var(--bad)">${fmt(f)}</b>`:'<span class="pill ok">0</span>';
      const tr=document.getElementById('cf-'+j);if(tr)tr.className=f?'s-bad':s!=null?'':'s-warn';const mi=document.getElementById('mf-'+o.id+'-'+j);if(mi)mi.placeholder=f?'Informe o motivo':'';
      const cr=document.getElementById('confRes');if(cr)cr.innerHTML=tilesConf(resumoConf(L.filter(x=>x.sit!=='ret')));}
    return;}

  if(o&&t.dataset.mf!=null){o.itens[Number(t.dataset.mf)].motivoFalta=t.value;Store.saveObra(o);const cr=document.getElementById('confRes');if(cr)cr.innerHTML=tilesConf(resumoConf(analisar(o).filter(x=>x.sit!=='ret')));return;}

main.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='anxFile'){const o=obraAtual();if(o&&t.files.length)anexarArquivos(o,[...t.files]);t.value='';return;}
  if(t.id==='bkFile'){if(t.files[0])lerBackup(t.files[0]);t.value='';return;}
  if(t.dataset.critLote){if(!e.isTrusted)return;ST.critLote=t.value;render();return;}
  if(t.dataset.stsel){
    const ob=ST.obras.find(x=>x.id===t.dataset.stsel);if(!ob)return;
    if(!e.isTrusted||t.value===ob.status){t.value=ob.status;return;} // ignora restaurações automáticas do visualizador
    ob.status=t.value;t.className='st-sel st-'+ob.status;[...t.options].forEach(op=>op.defaultSelected=op.value===ob.status);
    Store.saveObra(ob,0).then?.(()=>{});
    toast(`Reserva ${ob.reserva||ob.numero}: ${STATUS[stIdx(ob.status)].t}. Salvo.`);return;}
  if(!e.isTrusted)return;const o=obraAtual();
  if(o&&(t.dataset.iq!=null||t.dataset.of==='data')){const id=t.id;render();document.getElementById(id)?.focus();}
  if(t.dataset.cf){ST.config[t.dataset.cf]=t.value.trim();Store.saveConfig();render();}
  if(t.dataset.cmp){ST[t.dataset.cmp]=t.value;render();return;}
  if(t.dataset.ds!=null&&ST.div){ST.div.itens[Number(t.dataset.ds)].st=t.value;salvarDiv();render();return;}
  if(t.dataset.dp!=null&&ST.div){const n=parseNum(t.value);ST.div.itens[Number(t.dataset.dp)].preco=isNaN(n)?null:n;salvarDiv();render();return;}
  if(t.id==='adData'&&t.value){ST.adData=t.value;render();return;}
  if(t.dataset.exec){const ob=ST.obras.find(x=>x.id===t.dataset.exec);if(ob){ob.exec=t.value||null;ob.execEm=Date.now();Store.saveObra(ob,0);render();setTimeout(()=>{if(t.value&&t.value!=='conforme')document.getElementById('em-'+ob.id)?.focus();},30);}return;}
  if(t.dataset.dd&&INVD[t.dataset.dd]){INVD[t.dataset.dd].data=t.value;salvarRascunhoD();}
  if(t.id==='invData'&&INV){INV.data=t.value;Store.saveDraft();}
  if(t.id==='invObs'&&INV){INV.obs=t.value;Store.saveDraft();}
});

  if(e.key==='Enter'&&e.target.classList.contains('qty')){e.preventDefault();const all=[...main.querySelectorAll('input.qty'+(e.target.dataset.if!=null?'[data-if]':e.target.dataset.is!=null?'[data-is]':'[data-iq]'))];const i=all.indexOf(e.target);const nx=all[i+(e.shiftKey?-1:1)];if(nx){nx.focus();nx.select();}else e.target.blur();}
  if(e.key==='Enter'&&(e.target.id==='addCod'||e.target.id==='addQtd')){e.preventDefault();if(e.target.id==='addCod')document.getElementById('addQtd').focus();else main.querySelector('[data-act="add-item"]').click();}
  if(e.key==='Enter'&&e.target.dataset.pc!=null){e.preventDefault();const nx=main.querySelector('[data-pc="'+(Number(e.target.dataset.pc)+1)+'"]');if(nx){nx.focus();nx.select();}else e.target.blur();}
  if(e.key==='Enter'&&e.target.id==='pAdd'){e.preventDefault();main.querySelector('[data-act="invd-add"]').click();}
  if(e.key==='Enter'&&e.target.id==='serialScan'&&INVD.trafos){e.preventDefault();const q=e.target.value.trim().toUpperCase().replace(/\s/g,'');if(!q)return;
    const i=INVD.trafos.itens.findIndex(x=>String(x.serial).toUpperCase().replace(/\s/g,'')===q);
    if(i<0){toast('Serial '+q+' não está na IQ09.','bad');e.target.select();return;}
    const it=INVD.trafos.itens[i];it.est=true;if(!it.motivo)it.motivo='OK';salvarRascunhoD();render();
    const sc=document.getElementById('serialScan');sc.value='';sc.focus();const row=document.getElementById('tr-'+i);if(row){row.classList.add('flash');row.scrollIntoView({block:'center'});}
    toast('Serial '+q+' conferido: em estoque.');return;}
  if(e.key==='Enter'&&e.target.id==='invAdd'){e.preventDefault();main.querySelector('[data-act="inv-add"]').click();}
});
